<article class="bg-surface-container-low rounded-lg overflow-hidden flex flex-col group transition-all hover:shadow-2xl hover:shadow-emerald-900/10 h-full">
  <div class="h-72 overflow-hidden relative">
    <img [alt]="experience.imageAlt" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" [src]="experience.imageUrl"/>
    <div class="absolute top-4 left-4 flex gap-2" *ngIf="experience.badges && experience.badges.length > 0">
      <span *ngFor="let badge of experience.badges" class="bg-tertiary-container/90 backdrop-blur-md text-on-tertiary-container px-3 py-1 rounded-full text-xs font-bold">{{badge}}</span>
    </div>
    <button class="absolute top-4 right-4 bg-surface/30 backdrop-blur-md p-2 rounded-full text-white hover:bg-primary transition-all">
      <span class="material-symbols-outlined">favorite</span>
    </button>
  </div>
  <div class="p-8 bg-surface-container-lowest flex-1 flex flex-col">
    <div class="flex items-center gap-2 text-on-surface-variant text-sm mb-3">
      <span class="material-symbols-outlined text-sm">location_on</span> {{experience.location}}
    </div>
    <h3 class="text-2xl font-bold text-emerald-900 mb-4 group-hover:text-primary transition-colors">{{experience.title}}</h3>

    <div class="flex items-center gap-4 mb-6">
      <div class="flex items-center gap-1 text-amber-500 font-bold">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span> {{experience.rating | number:'1.1-1'}}
      </div>
      <span class="text-on-surface-variant text-sm">({{experience.reviewsCount}} avaliações)</span>
      <div class="flex items-center gap-1 text-on-surface-variant text-sm ml-auto">
        <span class="material-symbols-outlined text-sm">schedule</span> {{experience.duration}}
      </div>
    </div>

    <div class="mt-auto flex items-end justify-between">
      <div>
        <span class="text-sm text-on-surface-variant block">A partir de</span>
        <span class="text-3xl font-black text-emerald-900">{{experience.price | currency:'BRL':'symbol':'1.0-0'}}</span>
      </div>
      <button class="bg-primary text-on-primary px-8 py-3 rounded-xl font-bold hover:opacity-90 transition-all flex items-center gap-2">
        Reservar <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </div>
  </div>
</article>
