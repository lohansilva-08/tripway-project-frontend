<section class="py-24 px-8 max-w-screen-2xl mx-auto">
<div class="flex justify-between items-end mb-16">
<div>
<h2 class="text-4xl font-black font-headline text-primary tracking-tight">Categorias</h2>
<p class="text-outline mt-2">Escolha seu estilo de exploração</p>
</div>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-6">
<div *ngFor="let category of categories" class="group relative aspect-[4/5] overflow-hidden rounded-xl bg-surface-container-high cursor-pointer">
<img class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" [src]="category.imageUrl" [alt]="category.imageAlt">
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"></div>
<div class="absolute bottom-6 left-6">
<span class="text-white font-headline text-xl font-bold">{{category.name}}</span>
</div>
</div>
</div>
</section>
